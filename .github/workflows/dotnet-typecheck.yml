name: SNA .NET typecheck

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SNA.Domain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check domain entities against SQL schema
        run: python3 scripts/test_domain_schema.py
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build domain project
        run: dotnet build src/SNA.Domain/SNA.Domain.csproj --configuration Release --warnaserror
